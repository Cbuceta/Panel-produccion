<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spotsline Producción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#EFEFEC;--panel:#FFFFFF;--panel2:#F4F4F1;--ink:#141414;--muted:#5F5F5A;--line:#CFCFC8;--line2:#E3E3DE;
  --lamp:#F5C400;--lampbg:#FFF4BF;--lampink:#3D3100;--ok:#2B7555;--okbg:#DCEEE5;--bad:#B8412A;--badbg:#F6DFD8;--rail:#141414;--railink:#E6E6E1;--btn:#F5C400;--btnink:#141414;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0F0F;--panel:#1A1A1A;--panel2:#222222;--ink:#EDEDE8;--muted:#A3A39B;--line:#3A3A36;--line2:#2A2A27;
  --lamp:#FFD21F;--lampbg:#3A3000;--lampink:#FFE27A;--ok:#5DBB8E;--okbg:#17332A;--bad:#E3775F;--badbg:#3C211B;--rail:#000000;--railink:#D9D9D3;--btn:#FFD21F;--btnink:#141414;}}
:root[data-theme="dark"]{--bg:#0F0F0F;--panel:#1A1A1A;--panel2:#222222;--ink:#EDEDE8;--muted:#A3A39B;--line:#3A3A36;--line2:#2A2A27;
  --lamp:#FFD21F;--lampbg:#3A3000;--lampink:#FFE27A;--ok:#5DBB8E;--okbg:#17332A;--bad:#E3775F;--badbg:#3C211B;--rail:#000000;--railink:#D9D9D3;--btn:#FFD21F;--btnink:#141414;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.rail{background:var(--rail);color:var(--railink);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{font-stretch:125%;font-weight:800;font-size:17px;letter-spacing:.01em;padding:0 10px 2px;color:var(--lamp)}
.brandsub{font-stretch:75%;font-size:13px;opacity:.65;padding:0 10px 22px}
.rail a{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:6px;color:inherit;text-decoration:none;font-weight:500}
.rail a:hover{background:rgba(255,255,255,.06)}
.rail a.on{background:rgba(245,196,0,.14);color:var(--lamp);box-shadow:inset 3px 0 0 var(--lamp)}
.rail a.off{opacity:.5}
.rail .grp{font-size:12px;opacity:.5;padding:18px 10px 6px}
.rail .foot{margin-top:auto;font-size:12px;opacity:.6;padding:10px}
main{padding:28px 32px 60px;max-width:1280px;width:100%}
h1{font-stretch:112%;font-weight:700;font-size:28px;margin:0 0 4px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 22px;max-width:72ch}
h2{font-size:17px;font-weight:650;margin:0 0 12px}
h3{font-size:14px;font-weight:650;margin:0 0 8px}
.panel{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:18px 20px;margin-bottom:18px}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px;align-items:start}
.grid2>.panel{margin-bottom:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:10px;overflow:hidden;margin-bottom:18px}
.kpi{background:var(--panel);padding:16px 18px}
.kpi b{display:block;font-stretch:80%;font-size:34px;font-weight:650;line-height:1.05}
.kpi span{color:var(--muted);font-size:13px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>label.f{flex:1 1 140px;min-width:0}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--lamp);outline-offset:0;border-color:var(--ink)}
button:focus-visible,a:focus-visible,label.btn:focus-within{outline:2px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 4px var(--lamp)}
textarea{resize:vertical;min-height:38px}
.btn{background:var(--btn);color:var(--btnink);border:1px solid var(--btn);border-radius:6px;padding:9px 16px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .12s,transform .06s}
.btn:hover{background:#E0B200;border-color:#E0B200}
.btn:active{transform:translateY(1px)}
.btn.busy{cursor:progress;opacity:.75}
.btn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--ink)}
.btn.sec:hover{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.link{background:none;border:0;color:var(--muted);padding:2px 4px;text-decoration:underline;cursor:pointer;font-size:13px;font-weight:600}
.btn.link:hover{background:none;color:var(--bad)}

.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.note{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{background:none;border:0;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-color:var(--lamp)}
.tw{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
td.n,th.n{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--panel2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.lamp{background:var(--lampbg);color:var(--lampink)}
.good{color:var(--ok);font-weight:600}.poor{color:var(--bad);font-weight:600}
.banner{background:var(--lampbg);border:1px solid var(--lamp);border-radius:8px;padding:12px 14px;margin-bottom:18px;font-size:14px}
/* el tubo: ruta de la pieza */
.tubo{display:flex;gap:3px;align-items:stretch;margin:4px 0 2px}
.seg{flex:1 1 0;min-width:52px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;position:relative;overflow:hidden;height:30px}
.seg:first-child{border-radius:15px 3px 3px 15px}.seg:last-child{border-radius:3px 15px 15px 3px}.seg:only-child{border-radius:15px}
.seg i{position:absolute;inset:0 auto 0 0;background:var(--lamp);opacity:.55}
.seg i{opacity:.8}
.seg.full i{background:var(--ok);opacity:.5}
.seg span{position:relative;display:flex;justify-content:space-between;align-items:center;height:100%;padding:0 9px;font-size:12px;font-weight:600;font-stretch:85%;gap:6px;white-space:nowrap}
.seg span em{font-style:normal;font-weight:500;opacity:.8}
.pz{padding:10px 0;border-top:1px solid var(--line2)}
.pz:first-child{border-top:0}
.pzh{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.bars .b{display:grid;grid-template-columns:120px 1fr 92px;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.bars .t{height:14px;background:var(--panel2);border-radius:2px;overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--ink);opacity:.8}
.bars .t i.hot{background:var(--bad);opacity:.85}
.day .e{display:grid;grid-template-columns:96px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:14px;align-items:start}
.day .gap{color:var(--bad);font-size:13px;padding:6px 0 6px 106px;border-bottom:1px dashed var(--line)}
.day .t{font-stretch:85%;font-weight:600}
.cells{display:flex;gap:2px}
.cells i{width:26px;height:22px;border-radius:2px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10.5px;font-weight:600;font-stretch:75%;background:var(--panel2);color:var(--muted)}
.hide{display:none!important}
.fam{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:380px;overflow:auto}
.fam button:hover{border-color:var(--ink)}
.fam button{text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:7px 10px;cursor:pointer}
.fam button.on{border-color:var(--lamp);box-shadow:inset 0 0 0 1px var(--lamp)}
.fam small{display:block;color:var(--muted);font-size:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:8;padding:16px}
.dlg{background:var(--panel);border-radius:10px;border-top:4px solid var(--lamp);padding:18px 20px;width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column}
.dlgb{overflow:auto;flex:1;border:1px solid var(--line2);border-radius:6px;padding:4px 10px;min-height:120px}
.ogh{font-weight:700;font-size:13.5px;padding:10px 0 4px;border-bottom:1px solid var(--line)}
.orow{display:grid;grid-template-columns:22px 88px 1fr auto 96px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2);font-size:14px;cursor:pointer}
.orow:hover{background:var(--panel2)}.orow .t{font-stretch:85%;font-weight:600}.orow .n{text-align:right}
@media (max-width:600px){.orow{grid-template-columns:22px 1fr auto;}.orow .t,.orow>span:last-child{display:none}}
.drop{display:flex;flex-direction:column;gap:2px;align-items:flex-start;border:2px dashed var(--ink);border-radius:8px;padding:12px 14px;cursor:pointer;background:var(--panel2);transition:background .12s}
.drop b{color:var(--ink)}.drop:hover,.drop.over{background:var(--lampbg);border-color:var(--lamp)}.drop.busy{cursor:progress;opacity:.75}
.help{color:var(--ink);font-weight:600;white-space:nowrap;text-decoration:underline;text-decoration-color:var(--lamp);text-decoration-thickness:2px;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:inline-flex;gap:4px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:3px 6px 3px 10px;font-size:13px;font-weight:600}
.bpz{border:1px solid var(--line2);border-left:4px solid var(--lamp);border-radius:8px;padding:12px 14px;margin:10px 0;background:var(--panel)}
.bt td{vertical-align:middle}.bt input,.bt select{padding:5px 7px}
.btn.pulse{box-shadow:0 0 0 3px var(--lampbg)}
.toc{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:2px}.toc a{color:var(--ink);text-decoration:none;padding:6px 8px;border-radius:6px;font-size:14px}.toc a:hover{background:var(--lampbg)}
.ayuda ol,.ayuda ul{padding-left:20px;margin:6px 0}.ayuda li{margin:4px 0;max-width:75ch}.ayuda p{max-width:75ch}
@media (max-width:900px){.toc{position:static}}
.ptabs button{font-size:15px;padding:10px 14px}
.fimg{width:100%;border-radius:6px;border:1px solid var(--line);position:sticky;top:0}
.fx td{padding:4px 5px}.fx .pill{white-space:normal;max-width:190px;display:inline-block}.fx input,.fx select{padding:4px 6px;font-size:13px}.fx tr.off td{opacity:.45}
.kbtn{border:0;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:2px;transition:background .12s}
.kbtn:hover{background:var(--lampbg)}.kbtn small{font-size:12px;font-weight:700;color:var(--muted);margin-top:4px;text-decoration:underline;text-decoration-color:var(--lamp);text-decoration-thickness:2px;text-underline-offset:3px}
.kbtn:hover small{color:var(--ink)}
.bb{cursor:pointer;border-radius:4px;padding-left:4px;padding-right:4px}.bb:hover{background:var(--lampbg)}.bb:focus-visible{outline:2px solid var(--ink)}
.opc>.pzh{padding:4px 6px;border-radius:6px}.opc>.pzh:hover{background:var(--panel2)}.opc.open>.pzh{background:var(--lampbg)}
.vd{font-size:12.5px;font-weight:700;margin-left:6px;text-decoration:underline;text-decoration-color:var(--lamp);text-decoration-thickness:2px;text-underline-offset:3px}
.lote{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--lampbg);border:1px solid var(--lamp)}
.solo .rail{display:none}.solo .app{grid-template-columns:1fr}.solo main{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.op1 h1{font-size:24px}.ophead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:15px}
.opcard{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:16px;margin-bottom:12px}.opcard.run{border:2px solid var(--ok)}.opcard.warn{border:2px solid var(--lamp)}
.opt{font-size:26px;font-weight:800;font-stretch:90%}.opt span{background:var(--lamp);color:#141414;border-radius:6px;padding:0 8px;font-size:20px;margin-left:6px}.ops{font-size:15px;margin-top:4px}.opp{font-size:20px;font-weight:700;margin-top:6px}
.opnums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.opnums div{background:var(--panel2);border-radius:8px;padding:8px;text-align:center}.opnums b{display:block;font-size:24px;font-stretch:85%}.opnums span{font-size:12px;color:var(--muted)}
.opbig{display:block;width:100%;margin-top:12px;padding:16px;font-size:19px;font-weight:800;border-radius:10px;border:2px solid var(--btn);background:var(--btn);color:var(--btnink);cursor:pointer}
.opbig.sec{background:var(--panel);color:var(--ink);border-color:var(--ink);font-size:16px;padding:13px;margin-top:0}.opbig:active{transform:translateY(1px)}
.opgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opin{font-size:18px;padding:12px}
.oprow{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;margin-bottom:6px;font-size:15px;cursor:pointer;color:var(--ink)}.oprow span{color:var(--muted);font-size:13.5px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px 12px;gap:2px;z-index:5;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  :root{padding-top:0}
  .brandsub,.rail .grp,.rail .foot{display:none}.brand{padding-bottom:0;white-space:nowrap;margin-right:8px;font-size:15px}
  .rail a{white-space:nowrap;padding:7px 10px}.rail a.off{display:none}
  main{padding:20px 16px 60px}.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bars .b{grid-template-columns:90px 1fr 76px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail">
    <div class="brand">Spotsline</div>
    <div class="brandsub">Producción</div>
    <a href="#general" data-v="general">General</a>
    <a href="#plan" data-v="plan">Planificación</a>
    <div class="grp">Áreas</div>
    <a href="#taller" data-v="taller">Taller</a>
    <a href="#ot" data-v="ot">Operario (celular)</a>
    <a class="off" href="#" data-pronto="Pintura">Pintura <small>pronto</small></a>
    <a class="off" href="#" data-pronto="Armado">Armado <small>pronto</small></a>
    <div class="grp">Análisis</div>
    <a href="#desvios" data-v="desvios">Desvíos</a>
    <a href="#maestro" data-v="maestro">Maestro</a>
    <a href="#instructivo" data-v="instructivo">Instructivo</a>
  </nav>
  <main id="main"><p class="note">Cargando…</p></main>
</div>
<div class="toast" id="toast"></div>

  const rows=Object.entries(pend).filter(([,x])=>x.hs>0.01||x.sin).map(([t,x])=>{const cap=(T[t]?.puestos||1)*(T[t]?.horas_dia||7.5);const os=S.ordenes.filter(o=>abierta(o)&&o.lineas.some(l=>l.ops.some(w=>w.tipo===t&&(S.prog.get(woKey(o.id,l.pieza,w.seq))?.qty||0)<l.cant)));return {t,hs:x.hs,dias:x.hs/cap,sin:x.sin,n:os.length}}).sort((a,b)=>b.hs-a.hs);
  const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-label="Carga pendiente"><div class="pzh" style="align-items:center"><h2 style="margin:0">Horas estándar pendientes de las órdenes en curso</h2><button class="btn link" data-x>Cerrar</button></div>

  document.body.appendChild(m);m.onclick=e=>{if(e.target===m||e.target.hasAttribute('data-x'))m.remove()};

/* ---------- derivados ---------- */
const woKey=(op,pieza,seq)=>op+'|'+pieza+'|'+seq;
function entries(){const out=[];for(const p of S.partes)for(const it of (p.items||[]))out.push({...it,_doc:p.id,fecha:p.fecha});return out}
function recompute(){
  const m=new Map();
  for(const e of entries()){ if(e.tipo!=='prod'||!e.op_id)continue;
    const k=woKey(e.op_id,e.pieza,e.seq);const x=m.get(k)||{qty:0,scrap:0,min:0,std:0};
    x.qty+=+e.qty||0;x.scrap+=+e.scrap||0;x.min+=+e.min||0;x.std+=+e.std_min||0;m.set(k,x)}
  S.prog=m;
}
function opState(o){
  if(o.estado==='cancelada'||o.estado==='cerrada')return o.estado;
  let tot=0,done=0,any=false;
  for(const l of o.lineas||[])for(const w of l.ops){const p=S.prog.get(woKey(o.id,l.pieza,w.seq));const wt=(w.seg||1)*l.cant;tot+=wt;const q=p?p.qty:0;if(q>0)any=true;done+=Math.min(q,l.cant)*(w.seg||1)}
  const av=tot?done/tot:0;
  return av>=.999?'completa':any?'en proceso':'lanzada';
}
function opAvance(o){let tot=0,done=0;for(const l of o.lineas||[])for(const w of l.ops){const p=S.prog.get(woKey(o.id,l.pieza,w.seq));tot+=(w.seg||1)*l.cant;done+=Math.min(p?p.qty:0,l.cant)*(w.seg||1)}return tot?done/tot:0}
const abierta=o=>['lanzada','en proceso'].includes(opState(o));
function pendientesPorTipo(){
  const r={};
  for(const o of S.ordenes){if(!abierta(o))continue;
    for(const l of o.lineas)for(const w of l.ops){const p=S.prog.get(woKey(o.id,l.pieza,w.seq));const f=Math.max(0,l.cant-(p?p.qty:0));
      r[w.tipo]=r[w.tipo]||{hs:0,sin:0};if(w.seg)r[w.tipo].hs+=f*w.seg/3600;else if(f>0)r[w.tipo].sin++}}
  return r;
}
function workordersFor(tipo){
  const out=[];
  for(const o of S.ordenes){if(!abierta(o))continue;
    for(const l of o.lineas)for(const w of l.ops){if(tipo&&w.tipo!==tipo)continue;const p=S.prog.get(woKey(o.id,l.pieza,w.seq));const f=l.cant-(p?p.qty:0);
      if(f>0)out.push({o,l,w,falta:f,hecho:p?p.qty:0})}}
  out.sort((a,b)=>(a.o.prioridad==='urgente'?0:1)-(b.o.prioridad==='urgente'?0:1)||String(a.o.fecha_req).localeCompare(String(b.o.fecha_req))||a.w.seq-b.w.seq);
  return out;
}

function tubo(o,l){

}

/* ---------- escritura de partes (un doc por día y por quien carga) ---------- */
let wq=Promise.resolve();
function writeParte(fecha,mutate){

update(){const box=$('#dv');if(!box)return;const d0=$('#dDesde').value,d1=$('#dHasta').value;

  const cls=ef=>ef==null?'':ef>=.75?'background:var(--okbg);color:var(--ok)':ef<.55?'background:var(--badbg);color:var(--bad)':'background:var(--lampbg);color:var(--lamp)';
  const agg=(key)=>{const m={};for(const e of E){const k=key(e);if(!k)continue;const x=m[k]=m[k]||{real:0,std:0,realStd:0,par:0,qty:0,scrap:0,dia:{}};
    if(e.tipo==='prod'){x.real+=+e.min||0;if(e.std_min!=null){x.std+=e.std_min;x.realStd+=+e.min||0}x.qty+=+e.qty||0;x.scrap+=+e.scrap||0;const dd=x.dia[e.fecha]=x.dia[e.fecha]||{s:0,r:0};if(e.std_min!=null){dd.s+=e.std_min;dd.r+=+e.min||0}}
    else if(motivo(e.motivo)?.categoria!=='pausa')x.par+=+e.min||0}return m};
  const porOp=agg(e=>e.operario),porMaq=agg(e=>e.centro);
  const opRows=Object.entries(porOp).sort((a,b)=>(b[1].realStd?b[1].std/b[1].realStd:0)-(a[1].realStd?a[1].std/a[1].realStd:0));
  const maqRows=Object.entries(porMaq).sort((a,b)=>a[0].localeCompare(b[0],'es',{numeric:true}));

const PDEF={cobertura:0,redondeo:50,consolidar:true,dias:10,plazo:14};
function params(){return {...PDEF,...(S.P.parametros||{})}}
function compartidas(){const c={};for(const [f,v] of Object.entries(S.M.productos?.items||{}))for(const p of v.piezas)if(p.codigo){(c[p.codigo]=c[p.codigo]||new Set()).add(f)}
  const out=new Set();for(const [k,s] of Object.entries(c))if(s.size>1)out.add(k);return out}
function pzKey(fam,p,sh,cons){return cons&&p.codigo&&sh.has(p.codigo)?'C:'+p.codigo:fam+'|'+p.pieza}
function lastSeq(l){return l.ops.reduce((a,w)=>Math.max(a,w.seq),0)}
function sugerir(){
  const P=params();const prod=S.M.productos?.items||{};const vinc=S.M.vinculos?.items||{};const ven=S.M.ventas?.items||{};
  const sh=compartidas();const stock=S.P.stock?.items||{};
  const fams={},sinVinc=[],sinRuta=[];
  for(const r of S.P.pendiente?.items||[]){const falta=Math.max(0,-(+r.pron||0));const prom=r.prom!=null?(+r.prom||0):(+ven[r.code]||0);const dem=falta+P.cobertura*prom;
    if(dem<=0)continue;const fam=vinc[r.code]||(r.fam&&prod[r.fam]?r.fam:null)||r.fam;
    if(!fam){if(falta>0)sinVinc.push({...r,falta});continue}
    if(!prod[fam]){if(falta>0)sinRuta.push({...r,falta,fam});continue}
    const F=fams[fam]=fams[fam]||{fam,falta:0,prom:0,dem:0,codes:[]};F.falta+=falta;F.prom+=prom;F.dem+=dem;F.codes.push({code:r.code,nombre:r.nombre,falta,prom})}
  // en curso: lo que falta terminar de órdenes abiertas, por pieza
  const enCurso={};
  for(const o of S.ordenes){if(!abierta(o))continue;
    for(const l of o.lineas){const fam=o.tipo==='lote'?null:o.articulo;const k=l.codigo&&sh.has(l.codigo)&&P.consolidar?'C:'+l.codigo:(fam?fam+'|'+l.pieza:'C:'+l.codigo);
      const pr=S.prog.get(woKey(o.id,l.pieza,lastSeq(l)));enCurso[k]=(enCurso[k]||0)+Math.max(0,l.cant-(pr?pr.qty:0))}}
  const pz={};
  for(const F of Object.values(fams)){const dem=Math.ceil(F.dem);
    for(const p of prod[F.fam].piezas){const k=pzKey(F.fam,p,sh,P.consolidar);const X=pz[k]=pz[k]||{key:k,pieza:p.pieza,codigo:p.codigo,ops:p.ops,dem:0,dest:[],lote:k.startsWith('C:'),best:0};
      const q=dem*p.cant;X.dem+=q;X.dest.push({fam:F.fam,qty:q});if(q>X.best){X.best=q;X.ops=p.ops;X.pieza=p.pieza}}}
  for(const X of Object.values(pz))if(X.lote&&X.dest.length<2)X.lote=false;
  for(const X of Object.values(pz)){X.stock=+stock[X.key]||0;X.curso=enCurso[X.key]||0;X.neto=Math.max(0,X.dem-X.stock-X.curso);
    X.cant=X.neto>0?Math.ceil(X.neto/Math.max(1,P.redondeo))*Math.max(1,P.redondeo):0;X.sug=X.cant;{const ov=S.P.ajustes?.cant?.[X.key];if(ov!=null){X.cant=Math.max(0,+ov||0);X.ajustado=true}}
    X.hs={};for(const w of X.ops)if(w.seg)X.hs[w.tipo]=(X.hs[w.tipo]||0)+X.cant*w.seg/3600;X.sin=X.ops.filter(w=>!w.seg).length}
  const sug=[];
  for(const F of Object.values(fams)){const lines=prod[F.fam].piezas.map(p=>pz[pzKey(F.fam,p,sh,P.consolidar)]).filter(X=>X&&!X.lote);
    const todas=prod[F.fam].piezas.map(p=>pz[pzKey(F.fam,p,sh,P.consolidar)]);
    const act=lines.filter(X=>X.cant>0);
    sug.push({id:'A:'+F.fam,tipo:'articulo',titulo:F.fam,falta:F.falta,prom:F.prom,dem:Math.ceil(F.dem),codes:F.codes,lines,act,compartidas:todas.filter(X=>X&&X.lote)})}
  for(const X of Object.values(pz))if(X.lote){const falta=X.dest.reduce((a,d)=>a+(fams[d.fam]?.falta||0),0);
    sug.push({id:X.key,tipo:'lote',titulo:'Lote '+X.codigo,pieza:X.pieza,falta,dem:X.dem,lines:[X],act:X.cant>0?[X]:[],dest:X.dest})}
  for(const s of sug){s.lotes=Math.max(1,parseInt(S.P.ajustes?.lotes?.[s.id],10)||1);s.ajustado=s.lines.some(X=>X&&X.ajustado)||s.lotes>1;s.hs={};for(const X of s.act)for(const [t,h] of Object.entries(X.hs))s.hs[t]=(s.hs[t]||0)+h;s.hsTot=Object.values(s.hs).reduce((a,b)=>a+b,0);s.sin=s.act.reduce((a,X)=>a+X.sin,0)}
  sug.sort((a,b)=>b.falta-a.falta);
  return {sug,sinVinc:sinVinc.sort((a,b)=>b.falta-a.falta),sinRuta:sinRuta.sort((a,b)=>b.falta-a.falta),pz};
}
function parsePendienteXls(wb){
  const ws=wb.Sheets['Resumen'];if(!ws)return null;const A=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
  let h=-1;for(let i=0;i<Math.min(15,A.length);i++){const r=(A[i]||[]).map(x=>String(x??'').trim().toLowerCase());if(r.includes('art')&&r.includes('balance')){h=i;break}}
  if(h<0)return null;const H=A[h].map(x=>String(x??'').trim().toLowerCase());const ci=n=>H.indexOf(n);
  const cA=ci('art'),cB=ci('balance'),cP=ci('prom ventas'),cF=ci('familia'),cS=ci('pedidos - stock'),cPl=ci('plan armado');
  const items=[];for(const r of A.slice(h+1)){const code=r[cA];if(code==null||String(code).trim()==='')continue;const bal=+r[cB];if(!isFinite(bal))continue;
    const fam=cF>=0&&r[cF]!=null&&!String(r[cF]).startsWith('#')?String(r[cF]).trim():null;
    items.push({code:String(code).trim(),nombre:'',pron:bal,prom:cP>=0&&isFinite(+r[cP])?+r[cP]:null,fam,pedstock:cS>=0?+r[cS]||0:null,plan:cPl>=0?+r[cPl]||0:null})}
  if(!items.length)throw new Error('La hoja Resumen no tiene filas con Balance.');
  return items}
function parseOdoo(buf){
  const wb=XLSX.read(buf,{type:'array'});{const p=parsePendienteXls(wb);if(p){p.fuente='balance';return p}}const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{defval:null});
  if(!rows.length)throw new Error('El archivo está vacío.');
  const k=Object.keys(rows[0]);const col=n=>k.find(x=>x.trim().toLowerCase()===n);
  const cRef=col('referencia interna'),cPron=col('cantidad pronosticada'),cMano=col('cantidad a la mano'),cNom=col('nombre'),cCat=col('categoría del producto');
  if(!cRef||!cPron)throw new Error('No encuentro las columnas "Referencia interna" y "Cantidad pronosticada". Exportá el listado de productos de Odoo con esas columnas.');
  const vinc=S.M.vinculos?.items||{};
  const items=rows.filter(r=>r[cRef]&&(String(r[cCat]||'').startsWith('Producto Terminado')||vinc[String(r[cRef]).trim()])).map(r=>({code:String(r[cRef]).trim(),nombre:String(r[cNom]||''),mano:+r[cMano]||0,pron:+r[cPron]||0}));
  if(!items.length)throw new Error('No hay productos terminados en el archivo.');
  return items;
}
async function nextNumero(extra=0){const mx=S.ordenes.reduce((a,o)=>Math.max(a,parseInt(String(o.numero).replace(/\D/g,''),10)||0),1000);return String(mx+1+extra)}

async lanzar(){const P=params();const R=this.R;const list=R.sug.filter(s=>this.sel.has(s.id)&&s.lines.some(X=>X.cant>0));if(!list.length){toast('Marcá al menos una orden sugerida con cantidad a fabricar');return}if(busy('#sGoL'))return;
  const total=list.reduce((a,s)=>a+s.lotes,0);
  if(!confirm(`Se van a lanzar ${total} órdenes con fecha requerida ${fmtD(addDays(today(),P.plazo))}. ¿Continuar?`)){done('#sGoL');return}
  const hechas=[];const red=Math.max(1,P.redondeo);
  try{let n=0;for(const s of list){const act=s.lines.filter(X=>X.cant>0);
    for(let li=0;li<s.lotes;li++){
      const lineas=act.map(X=>{let q;if(s.lotes===1)q=X.cant;else{const part=Math.ceil(X.cant/s.lotes/red)*red;q=li<s.lotes-1?Math.min(part,Math.max(0,X.cant-part*li)):Math.max(0,X.cant-part*(s.lotes-1))}
        return {pieza:X.pieza,codigo:X.codigo||null,cant:q,necesidad:X.dem,ops:X.ops.map(w=>({...w}))}}).filter(l=>l.cant>0);
      if(!lineas.length)continue;
      const num=await nextNumero(n++);const id='op-'+num;const lt=s.lotes>1?` Lote ${li+1} de ${s.lotes}.`:'';
      const artCant=s.tipo==='lote'?lineas[0].cant:Math.round(Math.max(...lineas.map(l=>{const p=S.M.productos.items[s.titulo]?.piezas.find(p=>p.pieza===l.pieza);return l.cant/(p?.cant||1)})));
      const doc={numero:num,articulo:s.tipo==='lote'?'LOTE '+act[0].codigo:s.titulo,tipo:s.tipo,cantidad:artCant,fecha_req:addDays(today(),P.plazo),prioridad:'normal',
        notas:(s.tipo==='lote'?'Destinos: '+s.dest.map(d=>d.fam+' '+d.qty).join(', '):'Pendiente: '+s.codes.map(c=>c.code+' '+c.falta).join(', ')+(s.compartidas.length&&P.consolidar?'. En lote compartido: '+s.compartidas.map(X=>X.pieza+' ('+X.codigo+')').join(', '):''))+'.'+lt,
        lote:s.lotes>1?{n:li+1,de:s.lotes}:null,destinos:s.dest||null,origen:'pendiente',pendiente_importado:S.P.pendiente?.importado||null,estado:'lanzada',creada:new Date().toISOString(),creada_por:S.uid||null,lineas,modelo_odoo:'mrp.production'};
      await S.db.collection('ordenes').doc(id).set(doc);hechas.push({id,...doc})}}
    await this.saveAjuste(a=>{for(const s of list){for(const X of s.lines)delete a.cant[X.key];delete a.lotes[s.id]}});
    this.sel.clear();toast(hechas.length+' órdenes lanzadas');this.ultimas=hechas;this.ofrecer(hechas)}
  catch(e){toast('Se lanzaron '+hechas.length+'. Falló una: probá de nuevo.')}finally{done('#sGoL')}},
ofrecer(os){const b=document.createElement('div');b.className='banner';b.innerHTML=`<b>${os.length} órdenes lanzadas</b> (OP ${esc(os[0].numero)} a ${esc(os[os.length-1].numero)}). <span class="row" style="display:inline-flex;gap:8px;margin-left:8px"><button class="btn sm" id="dOt">Imprimir órdenes de trabajo</button><button class="btn sec sm" id="dPdf">Hojas de ruta en PDF</button><button class="btn sec sm" id="dXls">En Excel</button></span>`;

/* ---------- hojas de ruta ---------- */
let DL=null;
async function guardarArchivo(filename,blob){
  if(!DL)DL=await window.claude?.use?.('downloads');
  if(!DL){try{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500)}catch(e){toast('No se pudo descargar el archivo')}return}
  try{await DL.save({filename,data:blob})}catch(e){if(e?.code!=='declined')toast('No se pudo descargar el archivo')}}
function filasRuta(o){return o.lineas.map(l=>({l,ops:l.ops.map(w=>({w,pzh:w.seg?3600/w.seg:null,hs:w.seg?l.cant*w.seg/3600:null}))}))}
function descargarPDF(os){
  if(!window.jspdf){toast('No se pudo cargar el generador de PDF. Recargá la página.');return}
  const {jsPDF}=window.jspdf;const d=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const W=297,M=12;const cols=[['Paso',14],['Operación',22],['Máquina',30],['Std pz/h',20],['Hs est.',17],['Fecha',22],['Operario',40],['Máq. usada',22],['Hora ini-fin',26],['Cant. OK',20],['Scrap',16],['Firma',24]];
  const tw=cols.reduce((a,c)=>a+c[1],0);const sc=(W-2*M)/tw;
  os.forEach((o,oi)=>{if(oi)d.addPage();let y=M;
    const head=()=>{d.setFont('helvetica','bold');d.setFontSize(9);d.setFillColor(231,234,234);d.rect(M,y,W-2*M,7,'F');let x=M;cols.forEach(([n,w])=>{d.text(n,x+1.5,y+4.8);x+=w*sc});y+=7;d.setFont('helvetica','normal')};
    d.setFont('helvetica','bold');d.setFontSize(18);d.text('Hoja de ruta  OP '+o.numero,M,y+6);
    d.setFontSize(10);d.setFont('helvetica','normal');d.text('Spotsline Fabricación',W-M,y+2,{align:'right'});d.text('Emitida '+new Date().toLocaleDateString('es-AR'),W-M,y+7,{align:'right'});y+=12;
    d.setFontSize(11);d.setFont('helvetica','bold');d.text(String(o.articulo),M,y+4);d.setFont('helvetica','normal');
    d.text(`Cantidad: ${nf(o.cantidad)}    Requerida: ${o.fecha_req?o.fecha_req.split('-').reverse().join('/'):'-'}    Prioridad: ${o.prioridad||'normal'}`,M+70,y+4);y+=7;
    if(o.notas){d.setFontSize(9);const t=d.splitTextToSize(o.notas,W-2*M);d.text(t.slice(0,3),M,y+3);y+=Math.min(3,t.length)*4+2}
    const tot=filasRuta(o).reduce((a,r)=>a+r.ops.reduce((b,x)=>b+(x.hs||0),0),0);d.setFontSize(9);d.text(`Horas estándar totales: ${nf(tot,1)}`,M,y+3);y+=7;
    for(const r of filasRuta(o)){if(y>180){d.addPage();y=M}
      d.setFontSize(11);d.setFont('helvetica','bold');d.text(`${r.l.pieza}${r.l.codigo?'  ('+r.l.codigo+')':''}   ${nf(r.l.cant)} piezas`,M,y+4);y+=6;head();
      d.setFontSize(9.5);
      for(const x of r.ops){if(y>192){d.addPage();y=M;head()}
        let cx=M;const vals=[String(x.w.seq),x.w.op,tipoNombre(x.w.tipo),x.pzh?nf(x.pzh):'s/std',x.hs!=null?nf(x.hs,1):'-','','','','','','',''];
        vals.forEach((v,i)=>{const w=cols[i][1]*sc;d.setDrawColor(190,198,201);d.rect(cx,y,w,9);if(v)d.text(String(v),cx+1.5,y+5.8);cx+=w});y+=9;
        for(let k=0;k<2;k++){if(y>192){d.addPage();y=M;head()}let cx2=M;cols.forEach(([,w0],i)=>{const w=w0*sc;d.setDrawColor(215,220,222);d.rect(cx2,y,w,8);cx2+=w});y+=8}}
      y+=5}
    d.setFontSize(8);d.setTextColor(110);d.text('Completar a mano por cada tarea. Hay dos renglones extra por paso si la tarea se hace en varios turnos. Los datos se cargan en Taller.',M,203);d.setTextColor(0)});
  const name=os.length===1?`Hoja de ruta OP ${os[0].numero}.pdf`:`Hojas de ruta OP ${os[0].numero}-${os[os.length-1].numero}.pdf`;
  guardarArchivo(name,d.output('blob'))}

function otsDe(os){const out=[];
  for(const o of os)o.lineas.forEach((l,li)=>{const n=l.ops.length;l.ops.forEach((w,wi)=>{

    <p class="note">Las órdenes ya lanzadas guardan su propia copia de la ruta, como en Odoo: los cambios se aplican a las próximas órdenes.</p>`:''}`},
set(path,val){const d=this.draft;const k=path.split('.');let o=d;
  if(k[0]==='h'){d[k[1]]=val;return}
  const p=d.piezas[+k[0]];
  if(k.length===2){p[k[1]]=val}else if(k[1]==='mp'){p.mp=p.mp||{};p.mp[k[2]]=val}},
bind(){if(!this.draft||!S.canPlan)return;const E=$('#bEd');
  E.querySelectorAll('[data-h]').forEach(i=>i.oninput=i.onchange=()=>{this.draft[i.dataset.h]=i.dataset.h==='qty'?Math.max(1,+i.value||1):i.value;this.touch()});
  E.querySelectorAll('[data-p]').forEach(i=>i.oninput=i.onchange=()=>{const k=i.dataset.p.split('.');const p=this.draft.piezas[+k[0]];let v=i.value;
    if(k[1]==='cant')v=+v||0;if(k[1]==='codigo')v=v.trim()||null;
    if(k[1]==='mp'){p.mp=p.mp||{};p.mp[k[2]]=k[2]==='cant'?(v===''?null:+v):v}else p[k[1]]=v;this.touch()});
  E.querySelectorAll('[data-o]').forEach(i=>i.oninput=i.onchange=()=>{const [pi,wi,f]=i.dataset.o.split('.');const w=this.draft.piezas[+pi].ops[+wi];
    if(f==='seg'){w.seg=i.value===''?null:Math.max(0,+i.value)||null;const a=E.querySelector(`[data-pzh="${pi}.${wi}"]`),b=E.querySelector(`[data-min="${pi}.${wi}"]`);if(a)a.textContent=w.seg?nf(3600/w.seg):'–';if(b)b.textContent=w.seg?nf(w.seg/60,3):'–';i.style.borderColor=w.seg?'':'var(--bad)'}
    else if(f==='tipo'){w.tipo=i.value;if(!w.op||w.op===w._auto){w.op=i.value;w._auto=i.value;const oi=E.querySelector(`[data-o="${pi}.${wi}.op"]`);if(oi)oi.value=w.op}}
    else w.op=i.value.trim().toUpperCase();this.touch()});
  const re=()=>{this.touch();$('#bEd').innerHTML=this.editor();this.bind();this.touch()};
  E.querySelectorAll('[data-aop]').forEach(b=>b.onclick=()=>{const p=this.draft.piezas[+b.dataset.aop];const t=p.ops[p.ops.length-1]?.tipo||'GU';p.ops.push({seq:p.ops.length+1,op:t,tipo:t,seg:null,_auto:t});re()});
  E.querySelectorAll('[data-dop]').forEach(b=>b.onclick=()=>{const [pi,wi]=b.dataset.dop.split('.').map(Number);this.draft.piezas[pi].ops.splice(wi,1);re()});
  E.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{const [pi,wi,dd]=b.dataset.mv.split('.').map(Number);const a=this.draft.piezas[pi].ops;const j=wi+dd;if(j<0||j>=a.length){toast(dd<0?'Ya es la primera operación':'Ya es la última operación');return}[a[wi],a[j]]=[a[j],a[wi]];re()});
  E.querySelectorAll('[data-mvp]').forEach(b=>b.onclick=()=>{const [pi,dd]=b.dataset.mvp.split('.').map(Number);const a=this.draft.piezas;const j=pi+dd;if(j<0||j>=a.length){toast(dd<0?'Ya es el primer componente':'Ya es el último componente');return}[a[pi],a[j]]=[a[j],a[pi]];re()});
  E.querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>{const p=this.draft.piezas[+b.dataset.dp];if(!confirm('¿Quitar el componente '+(p.pieza||'sin nombre')+'?'))return;this.draft.piezas.splice(+b.dataset.dp,1);re()});
  E.querySelectorAll('[data-uv]').forEach(b=>b.onclick=()=>{this.draft._vinc=this.draft._vinc.filter(c=>c!==b.dataset.uv);re()});
  const vg=$('#bVinGo');if(vg)vg.onclick=()=>{const c=$('#bVin').value.trim();if(!c){toast('Escribí un código de Odoo');return}const ya=S.M.vinculos?.items?.[c];
    if(ya&&ya!==this.sel&&!confirm(`${c} hoy está vinculado a ${ya}. ¿Pasarlo a ${this.sel}?`))return;if(!this.draft._vinc.includes(c))this.draft._vinc.push(c);re()};
  $('#bAddP').onclick=()=>{this.draft.piezas.push({pieza:'',codigo:null,cant:1,uom:'Unidades',ops:[{seq:1,op:'GU',tipo:'GU',seg:null,_auto:'GU'}]});re();const ins=$('#bEd').querySelectorAll('[data-p$=".pieza"]');ins[ins.length-1]?.focus()};
  $('#bDisc').onclick=()=>{if(!this.dirty){toast('No hay cambios para descartar');return}if(!confirm('¿Descartar los cambios?'))return;const nuevo=this.draft._nuevo;this.dirty=false;this.draft=null;if(nuevo)this.sel=null;this.render()};
  $('#bSave').onclick=()=>this.guardar();
  $('#bDup').onclick=()=>{if(this.dirty){toast('Guardá o descartá los cambios antes de duplicar');return}const n=prompt('Nombre de la nueva lista de materiales (copia de '+this.sel+'):',this.sel+' COPIA');if(!n)return;const k=n.trim().toUpperCase();
    if(this.fams()[k]){toast('Ya existe '+k);return}const c=JSON.parse(JSON.stringify(this.draft));c._vinc=[];c._nuevo=true;this.sel=k;this.draft=c;this.dirty=true;this.render();this.touch()};
  $('#bDel').onclick=async()=>{if(this.draft._nuevo){this.dirty=false;this.draft=null;this.sel=null;this.render();return}
    const vs=this.vincs(this.sel);if(!confirm(`¿Eliminar la lista de materiales de ${this.sel}?${vs.length?` Hay ${vs.length} códigos de Odoo vinculados que van a quedar sin ruta.`:''}`))return;
    const all=JSON.parse(JSON.stringify(S.M.productos));delete all.items[this.sel];try{await S.db.doc('maestro/productos').set(all);toast('Lista de materiales eliminada');this.dirty=false;this.draft=null;this.sel=null;this.render()}catch(e){toast('No se pudo eliminar')}}},
nuevo(){if(this.dirty&&!confirm('Hay cambios sin guardar. ¿Descartarlos?'))return;const n=prompt('Nombre del artículo (familia), igual que en el pendiente. Ej: 1004, E3, BILINE 2');if(!n)return;const k=n.trim().toUpperCase();
  if(!k){toast('Escribí un nombre');return}if(this.fams()[k]){toast('Ya existe una lista para '+k);this.select(k);return}
  this.sel=k;this.draft={piezas:[{pieza:'',codigo:null,cant:1,uom:'Unidades',ops:[{seq:1,op:'GU',tipo:'GU',seg:null,_auto:'GU'}]}],qty:1,bomtipo:'normal',_vinc:Object.entries(S.M.vinculos?.items||{}).filter(([,f])=>f===k).map(([c])=>c),_nuevo:true};this.dirty=true;this.render();this.touch()},
async guardar(){const err=$('#bErr');err.textContent='';const d=this.draft;
  if(!this.dirty){toast('No hay cambios para guardar');return}
  if(!d.piezas.length){err.textContent='Agregá al menos un componente.';return}
  const nombres=new Set();for(const [i,p] of d.piezas.entries()){const n=(p.pieza||'').trim().toUpperCase();if(!n){err.textContent=`El componente ${i+1} no tiene nombre.`;return}
    if(nombres.has(n)){err.textContent=`El componente ${n} está repetido.`;return}nombres.add(n);p.pieza=n;if(!(p.cant>0)){err.textContent=`La cantidad de ${n} tiene que ser mayor a cero.`;return}
    if(!p.ops.length){err.textContent=`${n} no tiene operaciones. Toda pieza necesita al menos una.`;return}
    p.ops.forEach((w,wi)=>{w.seq=wi+1;w.op=(w.op||w.tipo).toUpperCase();delete w._auto});if(p.mp&&!p.mp.codigo)delete p.mp}
  if(busy('#bSave'))return;
  try{const all=JSON.parse(JSON.stringify(S.M.productos||{items:{}}));const clean=JSON.parse(JSON.stringify(d));const vinc=clean._vinc||[];delete clean._vinc;delete clean._nuevo;
    clean.actualizado=new Date().toISOString();all.items[this.sel]=clean;
    const v=JSON.parse(JSON.stringify(S.M.vinculos||{items:{}}));for(const [c,f] of Object.entries(v.items))if(f===this.sel&&!vinc.includes(c))delete v.items[c];for(const c of vinc)v.items[c]=this.sel;
    await S.db.doc('maestro/productos').set(all);await S.db.doc('maestro/vinculos').set(v);
    this.dirty=false;this.draft=null;toast('Lista de materiales de '+this.sel+' guardada');this.render()}
  catch(e){err.textContent='No se pudo guardar. Probá de nuevo.'}finally{done('#bSave')}}
};
function slug(s){return String(s).toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'')}
function exportarOdoo(){
  if(typeof XLSX==='undefined'){toast('No se pudo cargar el generador de Excel. Recargá la página.');return}
  const it=S.M.productos?.items||{};const T=S.M.centros?.tipos||{};const wb=XLSX.utils.book_new();
  const refPz=(fam,p)=>p.codigo||(slug(fam)+'-'+slug(p.pieza));
  const wc=[['name','code','default_capacity','time_efficiency']];for(const [k,t] of Object.entries(T))wc.push([t.nombre,k,t.puestos||1,100]);
  const sem=[['name','default_code','categ_id','type','uom_id']];const seen=new Set();
  const lp=[['product_tmpl_id','product_qty','type','bom_line_ids/product_id','bom_line_ids/product_qty','operation_ids/name','operation_ids/workcenter_id','operation_ids/time_cycle_manual','operation_ids/sequence']];
  for(const [fam,f] of Object.entries(it))for(const p of f.piezas){const r=refPz(fam,p);if(seen.has(r))continue;seen.add(r);
    sem.push([`${p.pieza} ${p.codigo?'':fam}`.trim(),r,'Parte/Pieza','product',p.uom||'Unidades']);
    const n=Math.max(p.ops.length,p.mp?.codigo?1:0);for(let i=0;i<n;i++){const w=p.ops[i];
      lp.push([i?'':r,i?'':1,i?'':'normal',i===0&&p.mp?.codigo?p.mp.codigo:'',i===0&&p.mp?.codigo?(p.mp.cant??''):'',w?`${w.op} ${p.pieza}`:'',w?(T[w.tipo]?.nombre||w.tipo):'',w&&w.seg?+(w.seg/60).toFixed(4):'',w?w.seq*10:''])}}
  const la=[['product_tmpl_id','product_qty','type','bom_line_ids/product_id','bom_line_ids/product_qty','familia_taller']];
  const vinc=S.M.vinculos?.items||{};
  for(const [code,fam] of Object.entries(vinc).sort()){const f=it[fam];if(!f)continue;
    f.piezas.forEach((p,i)=>la.push([i?'':code,i?'':(f.qty||1),i?'':(f.bomtipo||'normal'),refPz(fam,p),p.cant,i?'':fam]))}
  const info=[['Exportación de Spotsline Producción para importar en Odoo Fabricación'],[],['Orden sugerido de importación:'],['1. Centros de trabajo (Fabricación > Configuración > Centros de trabajo)'],['2. Semielaborados (Inventario > Productos). Categoría Parte/Pieza, ya existe en su Odoo.'],['3. LdM piezas: una lista por pieza con su ruta de operaciones y la materia prima.'],['4. LdM artículos: una lista por código de Odoo (cada color) con sus piezas como componentes.'],[],
    ['Los encabezados son los nombres técnicos de los campos de Odoo; al importar, Odoo los reconoce o permite asociarlos.'],['time_cycle_manual está en minutos por pieza. El campo type del producto puede llamarse distinto según la versión de Odoo (por ejemplo, "Rastrear inventario" en versiones recientes).'],['Pintura todavía no está modelada: cuando se sume, cada pieza pintada será otro nivel de la lista de materiales (pieza cruda + pintura).'],[],['Generado el '+new Date().toLocaleString('es-AR')]];
  const add=(n,a,w)=>{const s=XLSX.utils.aoa_to_sheet(a);if(w)s['!cols']=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,s,n)};
  add('Leeme',info,[110]);add('Centros de trabajo',wc,[22,8,16,15]);add('Semielaborados',sem,[34,20,14,10,12]);add('LdM piezas',lp,[22,11,9,24,18,26,22,24,18]);add('LdM artículos',la,[18,11,9,24,18,16]);
  guardarArchivo('Listas de materiales para Odoo.xlsx',new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})]))}

const AYUDA=[
 {id:'circuito',t:'Cómo funciona el circuito',h:`<p>Todo parte del pendiente de Odoo y termina en lo que confirma el taller:</p>
  <ol><li><b>Planificación</b> importa el pendiente y lanza órdenes de producción (OP).</li>
  <li>Cada OP se abre en <b>órdenes de trabajo</b>, una por proceso (pieza y paso), según la lista de materiales.</li>
  <li>Se <b>imprimen</b> las órdenes de trabajo y se reparten en cada puesto.</li>
  <li>El <b>taller</b> anota en la orden lo que hizo y se carga en la pantalla Taller.</li>
  <li><b>Desvíos</b> y <b>General</b> muestran avance, eficiencia y paradas en vivo.</li></ol>
  <p>Quién hace qué: el planificador necesita permiso de <b>Editor</b> en la página (lanza órdenes, importa, edita el maestro). Quien carga en el taller necesita permiso de <b>Colaborador</b>.</p>`},
 {id:'importar',t:'1. Importar el pendiente de Odoo',h:`<ol><li>En Odoo, exportá el listado de productos con las columnas <b>Referencia interna</b> y <b>Cantidad pronosticada</b> (el mismo export de siempre, "Producto (product_template)").</li>
  <li>En <b>Planificación</b>, tocá el recuadro <b>Importar Pendiente o export de Odoo</b> o arrastrá el archivo encima. Con el <b>Pendiente.xlsx</b> se toma la columna <b>Balance</b> de la hoja Resumen, que ya suma el plan de armado; con el export de Odoo, la Cantidad pronosticada.</li>
  <li>Esperá el mensaje en verde "Importado: …". El recuadro pasa a mostrar el archivo y la hora.</li></ol>
  <p>No hace falta copiar ni pegar nada. Cada importación reemplaza a la anterior para todos.</p>`},
 {id:'sugeridas',t:'2. Revisar las órdenes sugeridas',h:`<p>La lista muestra qué falta fabricar, ordenado por faltante. Para cada artículo:</p>
  <ul><li>Se suman todos los colores, porque el taller no fabrica por color.</li><li>Se descuenta lo que ya está lanzado y sin terminar (columna "En curso") y el stock en proceso que cargues.</li>
  <li>Las piezas que usan varios artículos salen como <b>lote compartido</b>: un solo lote, un solo juego de cambios de matriz.</li></ul>
  <p>Tocá una fila para ver el detalle por pieza. Al final de la pantalla aparecen los códigos de Odoo que no se pueden planificar porque no tienen lista de materiales: asignales el artículo cuya lista usan.</p>
  <p><b>Parámetros:</b> cobertura (cuántos períodos de venta promedio sumar al faltante; 0 = solo faltante), redondeo de lote, días hábiles del plan (para el gráfico de capacidad) y plazo de la fecha requerida.</p>`},
 {id:'ajustar',t:'3. Ajustar cantidades y lotes',h:`<p>En el detalle de cada sugerencia:</p>
  <ul><li><b>A fabricar</b>: editá la cantidad de cada pieza. Queda resaltada como "ajustado".</li><li><b>Artículos a fabricar</b>: fija todas las piezas de una vez según cuántas lleva cada artículo.</li>
  <li><b>Dividir en lotes</b>: al lanzar se crean varias OP separadas ("Lote 1 de 3").</li><li><b>Stock en proceso</b>: cargá lo que ya hay fabricado en el piso para que no se sugiera de más.</li>
  <li><b>Volver al sugerido</b> deshace los ajustes.</li></ul>
  <p>El gráfico de capacidad muestra en gris lo ya lanzado y en amarillo lo que marcaste, por tipo de máquina.</p>`},
 {id:'lanzar',t:'4. Lanzar e imprimir',h:`<ol><li>Marcá las sugerencias y tocá <b>Lanzar</b>.</li><li>En el aviso que aparece arriba, tocá <b>Imprimir órdenes de trabajo</b>.</li>
  <li>Elegí cuáles imprimir (podés filtrar por proceso) y tocá <b>Imprimir</b>. Se descarga un PDF con una orden por hoja A6, o cuatro por hoja A4 para cortar si lo elegís en Tamaño.</li></ol>
  <p>También podés bajar la <b>hoja de ruta</b> completa de cada OP (PDF) o el Excel. Todo esto está también en la pestaña <b>En curso</b>, abriendo cada OP, y arriba de la lista para imprimir por proceso las órdenes abiertas.</p>
  <p>La página no manda directo a la impresora: abrí el PDF descargado e imprimilo desde el visor.</p>`},
 {id:'ordenes',t:'En curso: seguir y modificar',h:`<ul><li>En <b>Planificación</b> hay tres pestañas: <b>A lanzar</b> (sugeridas según el pendiente), <b>En curso</b> (órdenes lanzadas y su estado) y <b>Orden manual</b>. Arriba se resume cuántas hay para lanzar, cuántas en curso, cuántas vencidas y las horas pendientes.</li><li>Cada OP muestra su avance como un tubo por pieza: un tramo por paso, que se llena con lo que confirma el taller.</li>
  <li>El planificador puede cambiar la cantidad de cada pieza de una orden abierta, cerrarla o cancelarla.</li>
  <li>También se puede crear una orden a mano (para stock, muestras o reposición puntual).</li></ul>`},
 {id:'taller',t:'Taller: confirmar el día',h:`<ol><li>Elegí la <b>fecha</b> y el <b>operario</b>.</li><li>En <b>Producción</b>: elegí la máquina; aparecen solo las órdenes de trabajo pendientes para ese tipo de máquina. Cargá hora de inicio, fin, cantidad y scrap. Antes de guardar ves la eficiencia contra el estándar.</li>
  <li>Si se hizo algo sin orden, elegí <b>Fuera de plan</b> e indicá artículo y pieza.</li><li>En <b>Parada o tarea</b>: cambios de matriz, limpieza, mantenimiento, refrigerio, etc.</li></ol>
  <p><b>Con el QR (recomendado):</b> cada orden de trabajo impresa lleva un QR. El operario lo escanea con la cámara de su celular y se abre su pantalla: elige su nombre la primera vez, toca <b>Empecé</b> al arrancar y <b>Terminé</b> al parar, con la cantidad y el scrap. Para cambios de matriz o paradas, <b>Parada o cambio de matriz</b>. Todo queda cargado al instante, sin papel. También se puede entrar desde el menú <b>Operario (celular)</b> y elegir la orden de la lista.</p>
  <p><b>El jefe con el celular:</b> si trabajan con la versión compartida de GitHub, el jefe abre la página en claude.ai (sin costo extra), lee las fotos de las planillas y en cada una toca <b>Agregar al lote</b>. Al terminar, <b>Descargar lote</b> baja un Excel. En la versión de GitHub, Taller > <b>Importar registros</b>: se revisa, se omiten los ya cargados y cada renglón se vincula con su orden de trabajo.</p>
  <p><b>Desde foto:</b> tocá <b>Cargar desde foto</b>, elegí la foto de la planilla en papel y esperá la lectura. Aparece cada renglón al lado de la foto para revisarlo: lo que está en rojo hay que corregirlo o desmarcarlo. Al guardar, cada renglón se vincula solo a su orden de trabajo si está en curso, o queda como fuera de plan.</p>
  <p>La hora de inicio se encadena con la tarea anterior. A la derecha queda el día del operario, con los <b>huecos sin registrar</b> marcados en rojo.</p>`},
 {id:'desvios',t:'Desvíos y General',h:`<ul><li><b>Eficiencia</b> = minutos estándar producidos / minutos reales, solo en pasos con tiempo cargado.</li><li>Por operario (con un cuadro por día), por máquina, horas no productivas por motivo y, por orden, plan contra hecho en cantidad, scrap y tiempo.</li>
  <li><b>General</b> resume órdenes abiertas, carga pendiente en días por tipo de máquina y lo que vence primero.</li></ul>`},
 {id:'ldm',t:'Listas de materiales (como en Odoo)',h:`<p>En <b>Maestro > Listas de materiales</b> está la base que usa todo el sistema. Sigue la lógica de Odoo Fabricación:</p>
  <ul><li><b>Lista de materiales</b> de un artículo: qué componentes (piezas) lleva y cuántos de cada uno. Todos los colores de Odoo del artículo comparten la misma lista.</li>
  <li><b>Componente</b>: cada pieza es un semielaborado, con su referencia interna. Si la misma referencia está en varios artículos, se fabrica en lote compartido.</li>
  <li><b>Ruta</b> de la pieza: las <b>operaciones</b> en orden, cada una en un <b>centro de trabajo</b> y con su tiempo por pieza. Odoo lo expresa en minutos por ciclo; se muestra al lado.</li>
  <li><b>Materia prima</b> (opcional): lo que consume cada pieza, por ejemplo kg de chapa.</li></ul>
  <p>Para <b>editar</b>: elegí el artículo, cambiá lo que necesites y tocá <b>Guardar lista de materiales</b>. Para <b>crear</b>: <b>Nueva lista de materiales</b>, o <b>Duplicar</b> una parecida y modificarla. Vinculá ahí mismo los códigos de Odoo (uno por color).</p>
  <p><b>Desde Excel:</b> en Maestro, <b>Descargar planilla de maestros</b> baja un Excel con todos los datos actuales (listas de materiales, tipos de máquina, máquinas, personal, motivos y vínculos con Odoo). Modificalo o agregá filas y usá <b>Subir planilla de maestros</b>: antes de importar se muestra un resumen y los errores fila por fila. Se agrega o actualiza por clave; nada se borra desde la planilla.</p>
  <p>Las órdenes ya lanzadas conservan la ruta con la que se lanzaron; los cambios aplican a las próximas. <b>Exportar para Odoo</b> genera un Excel con centros de trabajo, semielaborados y listas de materiales listo para importar cuando activen Fabricación.</p>`},
 {id:'glosario',t:'Glosario: de la planta a Odoo',h:`<div class="tw"><table><tr><th>En la planta</th><th>En Odoo</th></tr>
  <tr><td>Artículo / familia (1004, E3)</td><td>Producto terminado, un producto por color</td></tr><tr><td>Despiece</td><td>Lista de materiales</td></tr><tr><td>Pieza</td><td>Componente (semielaborado)</td></tr>
  <tr><td>Pasos de la pieza</td><td>Operaciones de la ruta</td></tr><tr><td>Máquina / tipo de máquina</td><td>Centro de trabajo</td></tr><tr><td>OP</td><td>Orden de producción</td></tr>

  else if(/^T\d$/.test(s))s='TO'+s.slice(1);else if(s==='TO'||s==='TORNO')s='TO1';else if(['LS','LA','LASER','LAZ'].includes(s))s='LAS';

  return C.includes(s)?s:''}

  for(const p of P){const parts=p.nombre.split(/\s+/).map(nrm);let sc=Math.max(dice(t,p.nombre),...parts.map(x=>x===tk?1:dice(tk,x)*0.9));
    if(String(t).split(/\s+/).map(nrm).filter(Boolean).every(w=>parts.includes(w)))sc=Math.max(sc,1);if(sc>bs){bs=sc;best=p.id}}

  if(!gh&&!/claude/.test(location.host))return '';return ''},

  const {o,l,w}=c;const maqs=(S.M.centros?.items||[]).filter(x=>x.tipo===w.tipo);const mq=lsGet('maq.'+w.tipo);const maq=maqs.some(x=>x.codigo===mq)?mq:(maqs.length===1?maqs[0].codigo:'');

  else if(enc){act=`<div class="opcard run"><h2>Trabajando desde las ${esc(enc.ini)}</h2><p class="note">${esc(enc.maq)}</p>
     <label class="f">Cantidad buena<input id="oQty" type="number" inputmode="numeric" min="0" class="opin"></label><label class="f" style="margin-top:8px">Scrap<input id="oSc" type="number" inputmode="numeric" min="0" value="0" class="opin"></label>

     <button class="opbig" id="oFin">Terminé</button><div class="row" style="gap:6px;margin-top:8px"><button class="btn sec" id="oPar">Parada o cambio de matriz</button><button class="btn link" id="oCancel">Cancelar tarea</button></div></div>`}
  else{act=`<div class="opcard"><label class="f">Máquina<select id="oMaq" class="opin"><option value="">Elegí la máquina</option>${maqs.map(x=>`<option ${x.codigo===maq?'selected':''}>${esc(x.codigo)}</option>`).join('')}</select></label><div class="err" id="oErr"></div>
     <button class="opbig" id="oIni">Empecé</button><div class="row" style="gap:6px;margin-top:8px"><button class="btn sec" id="oPar">Parada o cambio de matriz</button><button class="btn sec" id="oMano">Cargar a mano</button></div><div id="oManoF"></div></div>`}
  M.innerHTML=`<div class="op1">${head}${info}${act}</div>`;this.bindHead();

  const bI=$('#oIni');if(bI)bI.onclick=()=>{const m=$('#oMaq').value;if(!m){$('#oErr').textContent='Elegí la máquina.';return}lsSet('maq.'+w.tipo,m);CUR.set({yo,key:this.key,titulo,maq:m,ini:ahora(),fecha:today(),tipo:'prod'});toast('Empezaste a las '+ahora());this.render()};
  const bF=$('#oFin');if(bF)bF.onclick=async()=>{const q=parseInt($('#oQty').value,10);if(!(q>=0)){$('#oErr').textContent='Poné la cantidad buena que hiciste.';return}const sc=parseInt($('#oSc').value,10)||0;
    const fin=ahora();const m=diffMin(enc.ini,fin)||1;if(busy('#oFin'))return;
    try{await writeParte(enc.fecha,a=>a.push({id:newId(),tipo:'prod',operario:yo,centro:enc.maq,centro_tipo:centroTipo(enc.maq),op_id:o.id,op_numero:o.numero,articulo:o.articulo,pieza:l.pieza,seq:w.seq,paso:w.op,ini:enc.ini,fin,min:m,qty:q,scrap:sc,seg_std:w.seg||null,std_min:w.seg?q*w.seg/60:null,fuera_plan:false,obs:$('#oObs').value.trim(),origen:'qr',ts:new Date().toISOString()}));
      CUR.set(null);toast('Guardado: '+nf(q)+' piezas');this.render()}catch(e){$('#oErr').textContent='No se pudo guardar. Revisá la conexión y tocá de nuevo.'}finally{done('#oFin')}};
  const bC=$('#oCancel');if(bC)bC.onclick=()=>{if(confirm('¿Cancelar la tarea sin guardar?')){CUR.set(null);this.render()}};
  const bP=$('#oPar');if(bP)bP.onclick=()=>this.parada(yo,titulo,enc||{maq:$('#oMaq')?.value||''});
  const bFP=$('#oFinPar');if(bFP)bFP.onclick=async()=>{const fin=ahora();if(busy('#oFinPar'))return;
    try{await writeParte(enc.fecha,a=>a.push({id:newId(),tipo:'parada',operario:yo,centro:enc.maq||null,centro_tipo:enc.maq?centroTipo(enc.maq):null,motivo:enc.motivo,ini:enc.ini,fin,min:diffMin(enc.ini,fin)||1,obs:titulo,origen:'qr',ts:new Date().toISOString()}));
      if(enc.volver){CUR.set({...enc.volver,ini:fin});toast('Parada guardada. Seguís con la tarea desde las '+fin)}else{CUR.set(null);toast('Parada guardada')}this.render()}catch(e){toast('No se pudo guardar. Tocá de nuevo.')}finally{done('#oFinPar')}};
  const bM=$('#oMano');if(bM)bM.onclick=()=>{$('#oManoF').innerHTML=`<div style="margin-top:12px"><div class="row"><label class="f">Inicio<input type="time" id="mIni" class="opin"></label><label class="f">Fin<input type="time" id="mFin" class="opin" value="${ahora()}"></label></div>
     <div class="row" style="margin-top:8px"><label class="f">Cantidad buena<input id="mQty" type="number" inputmode="numeric" class="opin"></label><label class="f">Scrap<input id="mSc" type="number" inputmode="numeric" value="0" class="opin"></label></div><div class="err" id="mErr"></div><button class="opbig" id="mOk">Guardar</button></div>`;
    $('#mOk').onclick=async()=>{const m0=$('#oMaq').value,ini=$('#mIni').value,fin=$('#mFin').value,q=parseInt($('#mQty').value,10);const E=$('#mErr');
      if(!m0){E.textContent='Elegí la máquina.';return}const mm=diffMin(ini,fin);if(!mm){E.textContent='Revisá inicio y fin.';return}if(!(q>=0)){E.textContent='Poné la cantidad.';return}if(busy('#mOk'))return;const sc=parseInt($('#mSc').value,10)||0;
      try{await writeParte(today(),a=>a.push({id:newId(),tipo:'prod',operario:yo,centro:m0,centro_tipo:centroTipo(m0),op_id:o.id,op_numero:o.numero,articulo:o.articulo,pieza:l.pieza,seq:w.seq,paso:w.op,ini,fin,min:mm,qty:q,scrap:sc,seg_std:w.seg||null,std_min:w.seg?q*w.seg/60:null,fuera_plan:false,obs:'',origen:'qr',ts:new Date().toISOString()}));lsSet('maq.'+w.tipo,m0);toast('Guardado');this.render()}
      catch(e){E.textContent='No se pudo guardar. Tocá de nuevo.'}finally{done('#mOk')}}}},
parada(yo,titulo,enc){const M=S.M.motivos?.items||[];const box=document.createElement('div');box.className='modal';

  document.body.appendChild(box);box.onclick=e=>{if(e.target===box||e.target.hasAttribute('data-x'))box.remove()};

      if(c&&!c.falta){const m=diffMin(vol.ini,t0);if(m){try{await writeParte(vol.fecha,a=>a.push({id:newId(),tipo:'prod',operario:yo,centro:vol.maq,centro_tipo:centroTipo(vol.maq),op_id:c.o.id,op_numero:c.o.numero,articulo:c.o.articulo,pieza:c.l.pieza,seq:c.w.seq,paso:c.w.op,ini:vol.ini,fin:t0,min:m,qty:q,scrap:0,seg_std:c.w.seg||null,std_min:c.w.seg?q*c.w.seg/60:null,fuera_plan:false,obs:'',origen:'qr',ts:new Date().toISOString()}))}catch(e){toast('No se pudo guardar lo producido. Tocá de nuevo.');return}}}}
    CUR.set({yo,key:this.key,titulo,maq:(vol&&vol.maq)||enc.maq||'',ini:t0,fecha:today(),tipo:'parada',motivo:b.dataset.m,volver:vol});box.remove();toast('Parada desde las '+t0);this.render()})},
lista(){const T=S.M.centros?.tipos||{};const t=this.tipo||'';const ws=t?workordersFor(t):[];
  return `<div class="opcard"><h2>Elegí tu orden de trabajo</h2><p class="note">Lo más rápido es escanear el QR de la hoja con la cámara del celular.</p>

hoy(){const yo=this.yo();const es=entries().filter(e=>e.fecha===today()&&e.operario===yo).sort((a,b)=>(toMin(a.ini)||0)-(toMin(b.ini)||0));const box=document.createElement('div');box.className='modal';

  document.body.appendChild(box);box.onclick=e=>{if(e.target===box||e.target.hasAttribute('data-x'))box.remove()}},

function qrPDF(d,text,x,y,size){if(typeof qrcode==='undefined')return;const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount();const c=size/(n+4);
  d.setFillColor(255,255,255);d.rect(x,y,size,size,'F');d.setFillColor(0,0,0);for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))d.rect(x+(k+2)*c,y+(r+2)*c,c*1.02,c*1.02,'F')}

/* ---------- router ---------- */
function route(){const h=(location.hash||'#general').slice(1);let [v,sel,...rest]=h.split('/');if(v==='fabrica'){v='plan'}else if(v==='planificacion'){v='plan';V.plan.tab='curso'}else if(v==='plan'&&!sel){}const name=V[v]&&!['fabrica','planificacion'].includes(v)?v:'general';
  document.querySelectorAll('.rail a[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v===name));
  if(S.view&&S.view!==name)V[S.view]?.unmount?.();S.view=name;V[name].mount(sel,rest);try{window.scrollTo(0,0)}catch(e){}}

document.querySelectorAll('[data-pronto]').forEach(a=>a.onclick=e=>{e.preventDefault();toast(a.dataset.pronto+' se suma en la próxima etapa')});
function changed(what){const v=V[S.view];if(!v)return;
  if(what==='maestro'&&['taller','plan'].includes(S.view)){ /* formularios dependen del maestro */ if(!document.activeElement||document.activeElement===document.body)v.mount(v.sel);else v.update();return}
  v.update()}

/* ---------- arranque ---------- */
route();
(async()=>{
  let db=null,user=null;if(window.claude&&window.claude.use){[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}

  if(!db){db=localDB();S.local=true}
  if(user){try{S.uid=await user.id();/* accesos sin restricción por ahora */S.canPlan=true;S.canWrite=true;
}catch(e){}}
  S.db=db;S.live=true;route();
  for(const k of ['productos','centros','personal','motivos','vinculos','ventas']){
    db.doc('maestro/'+k).onSnapshot(s=>{S.M[k]=s.exists?s.data():null;S.loaded[k]=true;changed('maestro')},()=>{})}
  for(const k of ['pendiente','parametros','stock','ajustes'])db.doc('planificacion/'+k).onSnapshot(s=>{S.P[k]=s.exists?s.data():null;changed('plan')},()=>{});
  db.collection('ordenes').onSnapshot(q=>{S.ordenes=q.docs.map(d=>({id:d.id,...d.data()}));recompute();changed('datos')},()=>{});
  db.collection('partes').onSnapshot(q=>{S.partes=q.docs.map(d=>({id:d.id,...d.data()}));recompute();changed('datos')},()=>{});
})();
